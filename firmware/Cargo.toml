[package]
name = "reflow-plate-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g431kb", "time-driver-any", "exti", "memory-x"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"

defmt = "1.1"
defmt-rtt = "1.2"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }
heapless = { version = "0.9.2" }
usbpd = { version = "2.0.0", features = ["defmt"] }
usbpd-traits = { version = "2.0.0", features = ["defmt"] }
ssd1315 = "0.2.3"
embedded-graphics = "0.8.2"
embedded-layout = "0.4.2"
libm = "0.2.16"
pid = "4.0.0"
strum = { version = "0.28", default-features = false, features = ["derive"] }
display-interface = "0.5.0"
uom = { version = "0.36.0", default-features = false, features = ["autoconvert", "si"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
debug = 2
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "z"
lto = true
debug = 2
